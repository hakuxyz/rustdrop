name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-linux-android
            archive: tar.gz
            use-cross: true
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            archive: tar.gz
            use-cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cargo)
        if: '!matrix.use-cross'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="rustdrop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/rustdrop" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -czf "$stage.tar.gz" "$stage"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          stage="rustdrop-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/rustdrop.exe" "$stage/"
          cp README.md LICENSE "$stage/"
          7z a "$stage.zip" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdrop-${{ matrix.target }}
          path: rustdrop-*.tar.gz
          if-no-files-found: error
        if: matrix.archive == 'tar.gz'

      - name: Upload artifact (windows)
        uses: actions/upload-artifact@v4
        with:
          name: rustdrop-${{ matrix.target }}
          path: rustdrop-*.zip
          if-no-files-found: error
        if: matrix.archive == 'zip'

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum rustdrop-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
          body: |
            Pre-built binaries for **RustDrop ${{ github.ref_name }}**.

            | Target | Notes |
            | --- | --- |
            | `x86_64-unknown-linux-gnu` | glibc builds, most distros |
            | `x86_64-unknown-linux-musl` | fully static, no libc needed |
            | `aarch64-unknown-linux-gnu` | Raspberry Pi 64-bit, ARM servers |
            | `x86_64-apple-darwin` / `aarch64-apple-darwin` | macOS Intel / Apple Silicon |
            | `x86_64-pc-windows-msvc` | Windows 10+ |
            | `aarch64-linux-android` | Android (Termux) |
            | `armv7-linux-androideabi` | older Android (Termux) |

            Verify downloads against `SHA256SUMS.txt`.

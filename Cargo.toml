[package]
name = "rustdrop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["hakuxyz <beamzbyhakz@proton.me>"]
description = "Privacy-first, blazing-fast peer-to-peer file transfer for your local network"
license = "MIT"
repository = "https://github.com/hakuxyz/rustdrop"
homepage = "https://github.com/hakuxyz/rustdrop"
readme = "README.md"
keywords = ["p2p", "file-transfer", "mdns", "encryption", "lan"]
categories = ["command-line-utilities", "network-programming", "cryptography"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env", "color"] }
clap_complete = "4.6.11"
dialoguer = "0.12.0"
filetime = "0.2.29"
flate2 = "1.1.10"
globset = "0.4.19"
hex = "0.4.3"
hkdf = "0.13.0"
indicatif = "0.18.6"
mdns-sd = "0.21.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "fs",
    "time",
    "sync",
    "signal",
] }
walkdir = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
